<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Design Project Details and Confirmation</title></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column. Brief = 4 steps with a required-only progress strip. Setup and Confirmation reuse the same parts. */
:root{--font:"Inter",Arial,Helvetica,"Liberation Sans",sans-serif;--bg:#0E0E0E;--card:#1A1A1A;--ink:#F4F2EC;--dark:#E6E3DA;--body:#B9B6AD;--help:#A09D94;--ph:#8A877F;--line:#34332F;--panel:#242321;--acc:#FF6A1A;--acct:#FF8A4C;--rec:#FF8A4C;--acc-ink:#111111;--acc-tint:rgba(255,106,26,.16);--field:#121212;--ok:#6FCB93;--err:#FF8E7A;--grad:var(--acc);--glow:none;color-scheme:dark}
:root[data-theme="ember"]{--bg:#0E0E0E;--card:#1A1A1A;--ink:#F4F2EC;--dark:#E6E3DA;--body:#B9B6AD;--help:#A09D94;--ph:#8A877F;--line:#34332F;--panel:#242321;--acc:#FF6A1A;--acct:#FF8A4C;--rec:#FF8A4C;--acc-ink:#111111;--acc-tint:rgba(255,106,26,.16);--field:#121212;--ok:#6FCB93;--err:#FF8E7A;--grad:var(--acc);--glow:none;color-scheme:dark}
:root[data-theme="paper"]{--bg:#E9E4D8;--card:#F6F2E9;--ink:#2A2824;--dark:#3A372F;--body:#5A574E;--help:#625F55;--ph:#6F6B60;--line:#D2CBBB;--panel:#E6E0D2;--acc:#F0580F;--acct:#B93C0A;--rec:#B03709;--acc-ink:#1E1C18;--acc-tint:rgba(240,88,15,.13);--field:#FCFAF5;--ok:#2B7048;--err:#A92E1C;--grad:var(--acc);--glow:none;color-scheme:light}
:root[data-theme="neon"]{--bg:#0A0912;--card:#15131F;--ink:#F5F2FF;--dark:#E6E1F5;--body:#BDB7D1;--help:#A49DBA;--ph:#8C86A3;--line:#352F4B;--panel:#1F1B2E;--acc:#D45CFF;--acct:#E58BFF;--rec:#E58BFF;--acc-ink:#0A0912;--acc-tint:rgba(212,92,255,.16);--field:#100E19;--ok:#6FCB93;--err:#FF8E9B;--grad:linear-gradient(135deg,#FF4FA3,#8B5CF6);--glow:0 0 18px rgba(212,92,255,.38);color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
.wrap{max-width:760px;margin:0 auto}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:760px;margin:0 auto}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.brand{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--dark);display:flex;align-items:center;gap:8px;text-transform:uppercase}
.brand i{display:block;width:16px;height:2px;background:var(--grad)}
.stepnow{font-size:12.5px;color:var(--body);text-align:right}
.stepnow b{color:var(--ink)}
.saved{font-size:11.5px;color:var(--help);margin-left:10px;transition:opacity .4s;opacity:0}
.saved.on{opacity:1}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg{border:0;background:none;padding:0;text-align:left;display:block;min-height:24px}
.seg .t{height:4px;background:var(--line);border-radius:2px;overflow:hidden;position:relative}
.seg .t b{position:absolute;inset:0 auto 0 0;width:var(--f,0%);background:var(--grad);border-radius:2px;transition:width .35s ease}
.seg .l{display:flex;align-items:center;gap:5px;font-size:11px;letter-spacing:.04em;color:var(--help);margin-top:6px;white-space:nowrap;overflow:hidden}
.seg .l em{font-style:normal;font-weight:700}
.seg .l svg{width:11px;height:11px;flex:none;display:none;stroke:var(--acc);fill:none;stroke-width:2.6}
.seg.done .l svg{display:block}
.seg.cur .l{color:var(--ink);font-weight:700}
.seg:hover .l{color:var(--ink)}
.seg .opt{font-size:9.5px;border:1px solid var(--line);border-radius:999px;padding:0 5px;color:var(--help);letter-spacing:.04em}
@media(max-width:620px){.seg .l span.nm{display:none}.stepnow .nm{display:none}}
.pvbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:7px max(16px,env(safe-area-inset-left,0px));background:var(--acc-tint);font-size:12px}
.pvbar b{margin-right:4px}
.pvbar button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:3px 11px;font-size:12px}
.pvbar button[aria-pressed=true]{background:var(--grad);color:var(--acc-ink);border-color:var(--acct)}

/* hero */
.hero{padding:52px 0 36px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.16em;color:var(--dark);text-transform:uppercase}
.eyebrow i{width:36px;height:3px;background:var(--grad);display:block}
h1{font-size:clamp(32px,7vw,54px);line-height:1.04;letter-spacing:-.015em;margin:16px 0 18px;font-weight:700;text-wrap:balance;text-transform:uppercase}
.warm{font-size:18px;line-height:1.5;color:var(--dark);max-width:34em;margin:0 0 20px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.badge{font-size:12.5px;border:1px solid var(--line);padding:5px 11px;border-radius:999px;color:var(--body)}
.by{font-size:13px;color:var(--help);margin-top:18px}
.by b{color:var(--dark)}
.btn{background:var(--grad);color:var(--acc-ink);border:0;border-radius:6px;padding:0 22px;min-height:46px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,opacity .2s}
.btn:hover{opacity:.92}.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;cursor:progress}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn .sp{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn[disabled] .sp{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.welcome{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 14px;margin:0 0 20px;font-size:13.5px;color:var(--dark)}
.linkbtn{background:none;border:0;color:var(--acct);text-decoration:underline;padding:0;font-size:13.5px}
.warn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 14px;margin:0 0 20px;font-size:13.5px;color:var(--dark)}

/* sections */
section.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 22px 24px;margin:0 0 16px;scroll-margin-top:112px}
@media(max-width:620px){section.sec{padding:22px 16px 20px}}
h2:focus{outline:none}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.sh .n{width:34px;height:34px;border-radius:50%;background:var(--grad);color:var(--acc-ink);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
.sh h2{font-size:22px;margin:0;letter-spacing:-.005em;font-weight:700}
.sh .tag{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--help);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.sub{color:var(--body);margin:0 0 24px;font-size:14.5px}
.q{margin:0 0 24px}
.lab{display:block;font-size:16px;font-weight:600;color:var(--ink);margin:0 0 9px}
.lab .rq{color:var(--acct)}
.lab .ot{font-size:11px;font-weight:500;color:var(--help);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:8px;vertical-align:2px}
.lab+.hint{margin-top:-6px}
.hint{font-size:13.5px;color:var(--help);margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=url],textarea,select{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:11px 12px;font:inherit;font-size:15px;min-height:46px;transition:border-color .15s,box-shadow .15s}
select{appearance:auto}
textarea{resize:vertical;min-height:78px;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--ph);opacity:1}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acct);box-shadow:0 0 0 3px var(--acc-tint)}
.q.bad input,.q.bad textarea{border-color:var(--err)}
.err{display:none;font-size:13px;color:var(--err);margin-top:6px;font-weight:600;gap:6px;align-items:flex-start}
.err svg{width:15px;height:15px;flex:none;margin-top:2px;stroke:var(--err);fill:none;stroke-width:2.2}
.q.bad .err{display:flex}
.note{font-size:12.5px;color:var(--err);margin-top:6px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:44px;color:var(--dark);transition:border-color .15s,background .15s,transform .1s}
.chip:hover{border-color:var(--help)}
.chip:active{transform:scale(.98)}
.chip svg.ck{width:14px;height:14px;stroke:var(--acc);fill:none;stroke-width:2.6;display:none;flex:none}
.chip[aria-checked=true]{border-color:var(--acct);background:var(--acc-tint);color:var(--ink);font-weight:600}
.chip[aria-checked=true] svg.ck{display:block}
.chip.soft{border-style:dashed;color:var(--body)}
.other{margin-top:10px;max-width:420px}
.togglebox{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px}
.card{position:relative;background:var(--field);border:1px solid var(--line);border-radius:10px;transition:border-color .15s,background .15s}
.card:hover{border-color:var(--help)}
.card .cb{width:100%;background:none;border:0;padding:16px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--dark);font-size:14px;text-align:center;min-height:98px;border-radius:10px}
.card .cb svg{width:30px;height:30px;stroke:var(--help);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.card[data-on=true]{border-color:var(--acct);background:var(--acc-tint)}
.card[data-on=true] .cb svg{stroke:var(--acc)}
.card[data-on=true] .cb{color:var(--ink);font-weight:600}
.card .tick{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--grad);display:none;align-items:center;justify-content:center}
.card[data-on=true] .tick{display:flex}
.card .tick svg{width:11px;height:11px;stroke:var(--acc-ink);fill:none;stroke-width:3}
.qty{display:none;align-items:center;justify-content:center;gap:12px;padding:0 0 12px;font-size:13px;color:var(--body)}
.card[data-on=true] .qty{display:flex}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--field);line-height:1;font-size:17px;padding:0}
.qty b{min-width:18px;text-align:center;color:var(--ink)}
.chosen{margin-top:12px;font-size:13.5px;color:var(--dark);background:var(--panel);border-radius:8px;padding:8px 12px}

/* sliders */
.sl{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.sl:first-of-type{border-top:1px solid var(--line)}
.sl .l,.sl .r{font-size:14.5px;color:var(--body);font-weight:600}
.sl .r{text-align:right}
.sl .l.on,.sl .r.on{color:var(--acct)}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--field);padding:0;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s}
.dot:hover{border-color:var(--help)}
.dot i{width:11px;height:11px;border-radius:50%;background:var(--grad);transform:scale(0);transition:transform .15s}
.dot.on{border-color:var(--acct)}
.dot.on i{transform:scale(1)}
.sl .h{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;color:var(--help)}
.sl .h span:nth-child(2){text-align:right}
.sl .sk{background:none;border:0;color:var(--help);text-decoration:underline;font-size:12px;padding:2px 0}
@media(max-width:620px){
  .sl{grid-template-columns:1fr 1fr}
  .sl .dots{grid-column:1/-1;order:3;justify-content:space-between}
  .dot{width:42px;height:42px}
  .sl .h{order:4}
}

/* swatches */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.swb{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:left;transition:border-color .15s,background .15s;display:flex;flex-direction:column;gap:8px;min-height:44px}
.swb .st{display:flex;height:34px;border-radius:6px;overflow:hidden}
.swb .st span{flex:1}
.swb .tx{font-size:13.5px;color:var(--dark);display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.swb[aria-checked=true]{border-color:var(--acct);background:var(--acc-tint)}
.swb[aria-checked=true] .tx{font-weight:600;color:var(--ink)}

.timing{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.timing .dt{width:200px}
.links .row{display:flex;gap:8px;margin-bottom:8px}
.links .row button{flex:none;width:44px;border:1px solid var(--line);background:var(--field);border-radius:6px}

.lab .rc{font-size:11px;font-weight:600;color:var(--rec);margin-left:8px;vertical-align:2px;letter-spacing:.02em}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.stepok{font-size:13px;color:var(--ok);display:flex;align-items:center;gap:6px;font-weight:600}
.stepok svg{width:14px;height:14px;stroke:var(--ok);fill:none;stroke-width:2.6}
.errsum.soft{border-color:var(--line);background:var(--panel)}.errsum.soft a{color:var(--rec)}
.btn{box-shadow:var(--glow)}
.chip[aria-checked=true],.card[data-on=true],.swb[aria-checked=true]{box-shadow:var(--glow)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 24px;max-width:520px}
.th{border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:9px;text-align:left;display:flex;flex-direction:column;gap:7px;min-height:44px;transition:border-color .2s,transform .12s}
.th:active{transform:scale(.98)}
.th .pv{height:42px;border-radius:7px;display:flex;align-items:flex-end;justify-content:flex-start;padding:6px;gap:4px;border:1px solid rgba(128,128,128,.25)}
.th .pv i{display:block;height:8px;border-radius:4px}
.th b{font-size:13px;color:var(--ink)}
.th small{font-size:11.5px;color:var(--help);line-height:1.3}
.th[aria-checked=true]{border-color:var(--acc);box-shadow:var(--glow)}
.th[aria-checked=true] b::after{content:" \2713";color:var(--acct)}
.foot .ft{display:flex;gap:12px}.foot .ft button{background:none;border:0;padding:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--help);text-decoration:underline}
.foot .ft button[aria-pressed=true]{color:var(--ink);font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.hero>*{animation:rise .5s ease both}.hero>*:nth-child(2){animation-delay:.05s}.hero>*:nth-child(3){animation-delay:.1s}.hero>*:nth-child(4){animation-delay:.15s}.hero>*:nth-child(5){animation-delay:.2s}.hero>*:nth-child(6){animation-delay:.25s}
.enter{animation:slidein .3s ease both}
.stepok svg path,.seg.done .l svg path{stroke-dasharray:24;animation:draw .35s ease both}
.bigtick{width:56px;height:56px;stroke:var(--acc);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px}
.bigtick path{stroke-dasharray:24;animation:draw .5s .15s ease both}
/* confirmation / setup */
.pd{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--field)}
.pd .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--panel);padding:10px 16px;font-size:12px;letter-spacing:.06em;font-weight:700;color:var(--dark)}
.pdr{display:grid;grid-template-columns:160px 1fr;gap:6px 16px;padding:13px 16px;border-top:1px solid var(--line);font-size:14.5px}
.pdr dt{color:var(--help);font-size:12.5px;font-weight:600;padding-top:2px}
.pdr dd{margin:0;color:var(--ink);white-space:pre-wrap}
@media(max-width:620px){.pdr{grid-template-columns:1fr}}
.dlh,.dlr{display:grid;grid-template-columns:2fr .6fr 1.6fr 1.4fr;gap:6px 12px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
.dlh{font-size:11.5px;font-weight:600;color:var(--help);letter-spacing:.04em}
.dlr span::before{content:attr(data-l);display:none;font-size:11.5px;color:var(--help);font-weight:600;margin-right:6px}
@media(max-width:620px){.dlh{display:none}.dlr{grid-template-columns:1fr 1fr;padding:10px 0}.dlr span:first-child{grid-column:1/-1;font-weight:600}.dlr span::before{display:inline}}
.tg{margin:30px 0 0}
.tg h3{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;color:var(--dark)}
.terms{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.terms li{display:grid;grid-template-columns:30px 1fr;gap:6px;font-size:14.5px;color:var(--body)}
.terms li b.nn{color:var(--acct)}
.terms li strong{color:var(--ink)}
.conf{border:1px solid var(--line);border-radius:10px;padding:20px 18px;margin-top:26px;background:var(--panel)}
.conf p{margin:0 0 14px;font-size:14.5px;color:var(--dark)}
.agree{display:flex;gap:12px;align-items:flex-start;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:12px 14px;width:100%;text-align:left;color:var(--ink);margin-bottom:6px;min-height:48px}
.agree .bx{width:22px;height:22px;border:1.5px solid var(--help);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s}
.agree .bx svg{width:13px;height:13px;stroke:var(--acc-ink);fill:none;stroke-width:3;display:none}
.agree[aria-checked=true]{border-color:var(--acct)}
.agree[aria-checked=true] .bx{background:var(--grad);border-color:var(--acct)}
.agree[aria-checked=true] .bx svg{display:block}
.q.bad .agree{border-color:var(--err)}
.sumbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px}
.errsum{display:none;border:1px solid var(--err);background:var(--acc-tint);border-radius:8px;padding:12px 14px;font-size:14px;margin-top:16px;color:var(--ink)}
.errsum.on{display:block}
.errsum ul{margin:6px 0 0;padding-left:18px}
.errsum a{color:var(--err);font-weight:700}
.rad{display:grid;gap:8px}
.rad .chip{justify-content:flex-start;text-align:left}
.sbox{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;background:var(--field)}
.sbox h3{margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.drow{display:grid;grid-template-columns:2fr .6fr 1.6fr 1.4fr 40px;gap:8px;margin-bottom:8px}
.drow button{border:1px solid var(--line);background:var(--field);border-radius:6px}
@media(max-width:700px){.drow{grid-template-columns:1fr 1fr;padding-bottom:10px;border-bottom:1px solid var(--line)}.drow input:first-child{grid-column:1/-1}}
.linkout{display:flex;gap:8px;margin-top:10px}
.linkout input{font-size:12.5px}
.mini{font-size:12.5px;color:var(--help)}

/* thank you */
.thanks{padding:56px 0 60px;display:none}
.thanks.on{display:block}
.thanks h2{font-size:clamp(28px,6vw,42px);line-height:1.08;margin:14px 0;text-transform:uppercase}
.ref{display:inline-block;border:1px dashed var(--help);border-radius:6px;padding:8px 14px;font-weight:700;letter-spacing:.1em;margin:6px 0 24px}
.next{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 28px}
.next div{border-top:3px solid var(--line);padding-top:10px;font-size:14px;color:var(--body)}
.next div.a{border-color:var(--acct)}
.next b{display:block;color:var(--ink);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
@media(max-width:620px){.next{grid-template-columns:1fr}}
pre.mail{white-space:pre-wrap;word-break:break-word;background:var(--panel);border-radius:8px;padding:14px;font-size:12.5px;line-height:1.5;color:var(--dark);max-height:340px;overflow:auto}
details.pv{margin-top:18px}
details.pv summary{cursor:pointer;color:var(--body);font-size:13.5px}
.foot{border-top:1px solid var(--line);padding:22px 0 40px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--help);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.proto{background:var(--acc-tint);color:var(--ink);font-size:12.5px;text-align:center;padding:7px 12px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)))}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
@media print{.bar,.pvbar,.proto,.sumbar,.hero .btn,#sticky{display:none!important}body{background:#fff;color:#000}section.sec{break-inside:avoid-page}}

 '<div class="pdr"><dt>Scope of work</dt><dd>'+h(d.scope)+'</dd></div>'+
 '<div class="pdr"><dt>Deliverables</dt><dd><div class="dlh"><span>Item</span><span>Qty</span><span>Size or platform</span><span>Format</span></div>'+rows.map(function(r){return '<div class="dlr"><span data-l="Item">'+h(r[0])+'</span><span data-l="Qty">'+h(r[1])+'</span><span data-l="Size">'+h(r[2])+'</span><span data-l="Format">'+h(r[3])+'</span></div>'}).join("")+'</dd></div>'+
 '<div class="pdr"><dt>Revisions</dt><dd>'+h(d.rev)+'</dd></div><div class="pdr"><dt>Delivery date</dt><dd>'+h(d.deliv)+'</dd></div><div class="pdr"><dt>Project fee</dt><dd>'+h([d.cur,d.fee].filter(Boolean).join(" "))+'</dd></div><div class="pdr"><dt>Payment</dt><dd>'+h(d.pay)+(d.payn?'\n'+h(d.payn):'')+'</dd></div></dl></div></section>'+
 '<section class="sec" aria-labelledby="h-tc"><div class="sh"><h2 id="h-tc">Project terms &amp; conditions</h2></div><p class="sub" style="margin-bottom:0">Short and in plain language. Please read all of it.</p>'+tg+'</section>'+
 '<section class="sec" aria-labelledby="h-cf"><div class="sh"><h2 id="h-cf">Your confirmation</h2></div>'+
 (d.conf?'':'<div class="q" id="q-port" data-qid="port"><label class="lab" id="lb-port">May we show this work in our portfolio?</label><p class="hint">Your choice does not change the project. You can change your mind later by writing to us.</p><div class="rad" role="radiogroup" aria-labelledby="lb-port" data-grp="port">'+["Yes, you may show it in your portfolio and on social media","Only after you ask me first","No, please keep this project private"].map(function(x,i){return chipHtml({id:"port"},x,CS.port===x,"",true)}).join("")+'</div><div class="err" id="e-port" role="alert"></div></div>')+
 '<div class="conf"><p>I have read the project details and terms above and I accept them. This confirms the agreed project details. Final design approval is recorded separately.</p>'+
 '<div class="q" id="q-agree" data-qid="agree" style="margin:0 0 14px"><button type="button" class="agree" role="checkbox" aria-checked="'+(!!CS.agree)+'" data-act="agree"><span class="bx" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span>I have read and accept the project details and terms. <span style="color:var(--acct)" aria-hidden="true">*</span></span></button><div class="err" id="e-agree" role="alert"></div></div>'+
 '<div class="grid2"><div class="q" id="q-signame" data-qid="signame" style="margin:0"><label class="lab" for="f-signame">Your full name <span class="rq" aria-hidden="true">*</span></label><input id="f-signame" type="text" data-act="cin" data-q="signame" placeholder="Type your full name" value="'+h(CS.signame||"")+'" autocomplete="name"><div class="err" id="e-signame" role="alert"></div></div>'+
 '<div class="q" style="margin:0"><label class="lab" for="f-sdate">Date</label><input id="f-sdate" type="text" value="'+today()+'" readonly></div></div></div>'+
 '<div class="errsum" id="errsum" role="alert" tabindex="-1"></div><div class="sumbar"><button class="btn" type="button" id="acceptBtn" data-act="accept"'+(nogood?' disabled':'')+'><span class="sp" aria-hidden="true"></span><span class="bt">Accept and confirm</span></button><button class="btn ghost" type="button" data-act="chgopen">I would like to change something</button><span class="hint" style="margin:0" id="subNote" role="status"></span></div>'+
 '<div class="togglebox" id="chgbox" hidden><label class="lab" for="f-chg" style="font-size:14px">What would you like to change?</label><div id="chgForm"><textarea id="f-chg" rows="3" data-act="cin" data-q="chg" placeholder="Tell us what you would like adjusted"></textarea><div class="sumbar" style="margin-top:10px"><button class="btn ghost" type="button" id="chgSendBtn" data-act="chgsend"><span class="sp" aria-hidden="true"></span><span class="bt">Send this to the designer</span></button><span class="hint" style="margin:0" id="chgNote" role="status"></span></div></div><div id="chgDone" hidden role="status"><p style="margin:0 0 8px"><b>Sent. Your designer has received your message.</b></p><p class="hint" style="margin:0 0 10px">They will reply to you directly, so there is no need to send it again. Your confirmation is still waiting above, whenever you are ready.</p><pre class="mail" id="chgSent" style="max-height:140px"></pre><button class="linkbtn" type="button" data-act="chgmore">Write another message</button></div></div></section></div>'+
 '<section class="thanks" id="thanks" aria-live="polite" tabindex="-1"><svg class="bigtick" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.5 3.5L17 8.5"/></svg><div class="eyebrow"><i></i>Confirmed</div><h2 id="thT">Thank you. This is confirmed.</h2><p class="warm" id="thP">Your designer has received your confirmation and will contact you about the next steps. Keep a copy for your records.</p><div class="ref" id="refNo2"></div><div class="sumbar"><button class="btn ghost" type="button" id="copyBtn2">Copy a summary</button></div><details class="pv" id="pv"><summary>Preview: what your designer receives</summary><pre class="mail" id="mailPv"></pre></details></section>'}

/* ================= MODES ================= */
var MODE="brief",PVW=false,PM=null,EXD=exSetup(),CD=null,CS={};
function hashMode(){var hs=location.hash||"";if(hs==="#setup"||hs.indexOf("#setup=")===0)return "setup";if(hs.indexOf("#c=")===0||hs.indexOf("#p=")===0)return "confirm";return "brief"}
function currentMode(){return PM||hashMode()}
function mountBar(){var seg=$("#segs"),bt=$("#brandTxt");
 if(MODE==="brief"){bt.textContent="Design Project";seg.hidden=false;seg.innerHTML=SECS.map(function(s,i){return '<button type="button" class="seg" data-act="goto" data-sec="'+s.id+'" aria-label="Go to step '+(i+1)+': '+h(s.t)+(s.id==="look"?', optional':'')+'"><div class="t"><b></b></div><div class="l"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg><em>'+s.n+'</em><span class="nm">'+h(s.t)+'</span>'+(s.id==="look"?'<span class="opt">Optional</span>':'')+'</div></button>'}).join("")}
 else{seg.hidden=true;seg.innerHTML="";bt.textContent=MODE==="setup"?"Design Project · Designer setup":"Design Project · Confirmation";$("#stepTxt").textContent=""}}
function mount(){MODE=currentMode();PVW=(location.hash||"").indexOf("#p=")===0&&!PM;var app=$("#app");mountBar();$("#footBy").textContent="";
 $$("#pvbar button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.pm===MODE))});
 if(MODE==="brief"){app.innerHTML=briefHtml();var had=load();if(had){app.innerHTML=briefHtml();$("#welcome").innerHTML='<div class="welcome"><span>Welcome back. Your earlier answers are restored.</span><button class="linkbtn" type="button" id="startOver">Start over</button></div>';$("#startOver").addEventListener("click",function(){S=fresh();try{localStorage.removeItem("dp_brief_v2")}catch(e){}mount()})}
   warnStore();var sent=null;try{sent=sessionStorage.getItem("dp_sent")}catch(e){}if(sent&&!had){$("#storewarn").insertAdjacentHTML("afterbegin",'<div class="warn">You already sent a brief in this session (reference '+h(sent)+'). You can send another if this is a new project.</div>')}
   $("#startBtn").addEventListener("click",function(){showStep(0);var f=$("#f-name");if(f&&!f.value)f.focus({preventScroll:true})});
   $("#editBtn").addEventListener("click",function(){submitted=false;$("#thanks").classList.remove("on");$("#briefArea").hidden=false;$("#segs").style.opacity=1;var b=$("#submitBtn");if(b)b.disabled=false;$("#subNote").textContent="";showStep(3)});
   $("#copyBtn").addEventListener("click",function(){copy(lastCopy,this)});showStep(-1,true)}
 else if(MODE==="setup"){startSetup();app.innerHTML=setupHtml()}
 else{var d=null;if(PM==="confirm"){d=(SD&&SD.scope)?SD:EXD}else{var t=(location.hash||"").slice(3);d=decodeSetup(t)}
   if(!d){app.innerHTML='<section class="hero"><div class="eyebrow"><i></i>Design Project</div><h1>This link is incomplete</h1><p class="warm">We could not read the project details from this link. Please ask your designer to send it again.</p></section>';return}
   CD=d;CS={};app.innerHTML=confirmHtml(d);$("#footBy").textContent=d.designer?"Prepared by "+d.designer:"";
   $("#copyBtn2").addEventListener("click",function(){copy(lastCopy,this)});var prev=(CFG.proto||PVW)?null:getAccepted(d);if(prev)showAccepted(d,prev)}
 window.scrollTo({top:0})}
window.addEventListener("hashchange",function(){if(!CFG.proto||!PM)mount()});
$("#pvbar").addEventListener("click",function(ev){var b=ev.target.closest("button[data-pm]");if(!b)return;PM=b.dataset.pm==="brief"?"brief":b.dataset.pm;if(PM==="confirm"&&!SD)SD=loadSetup();mount()});

/* ================= CONFIRM + SETUP ACTIONS ================= */
function validateConfirm(){var bad=[];if(!CD.conf&&!CS.port)bad.push(["port","Please choose an option for the portfolio.","Portfolio choice"]);
 if(!CS.agree)bad.push(["agree","Please tick the box to confirm.","Tick to accept the details and terms"]);
 if(!(CS.signame||"").trim())bad.push(["signame","Please type your full name.","Your full name"]);return bad}
function acceptNow(){if(sending)return;var bad=validateConfirm(),box=$("#errsum");
 $$(".q.bad").forEach(function(e){clearBad(e.dataset.qid)});
 if(bad.length){bad.forEach(function(b){setBad(b[0],b[1])});box.innerHTML='Please complete these first:<ul>'+bad.map(function(b){return '<li><a href="#q-'+b[0]+'" data-jump="'+b[0]+'">'+h(b[2])+'</a></li>'}).join("")+'</ul>';box.classList.add("on");box.focus();focusQ(bad[0][0]);return}
 box.classList.remove("on");var d=CD,ts=new Date().toISOString();
 var msg=["PROPOSAL ACCEPTED","Reference: "+(d.ref||"-"),"Accepted by (typed name): "+CS.signame.trim(),"Accepted on: "+today()+" ("+ts+")","Portfolio choice: "+(d.conf?"Confidential project, no portfolio use":CS.port),"Terms version: "+(d.tv||CFG.tv),"Client confirmed: I have read the project details and terms and I accept them.","","----",proposalText(d)].join("\n");
 lastMsg=msg;lastCopy=summaryConfirm(d,CS);sending=true;var btn=$("#acceptBtn");btn.disabled=true;$("#subNote").textContent="Sending...";
 send("Proposal accepted - "+(d.client||CS.signame)+" - "+(d.ref||"no ref"),msg,CS.signame.trim(),"").then(function(){sending=false;$("#confArea").hidden=true;$("#refNo2").textContent=d.ref||"";$("#mailPv").textContent=msg;$("#pv").hidden=!CFG.proto;$("#thanks").classList.add("on");if(PVW){$("#thT").textContent="Preview finished";$("#thP").textContent="This was only a preview. Nothing was sent to anyone.";var c2=$("#copyBtn2");if(c2)c2.hidden=true;$("#pv").hidden=true}else{setAccepted(d,{n:CS.signame.trim(),date:today()})}window.scrollTo({top:0});$("#thanks").focus({preventScroll:true})},function(e){sending=false;btn.disabled=false;$("#subNote").textContent="";sendError(box,friendlyErr(e),msg);box.focus()})}
var chgSending=false,chgLast="",chgCount=0;
function sendChange(){if(chgSending)return;var ta=$("#f-chg"),n=$("#chgNote"),btn=$("#chgSendBtn"),t=(ta.value||"").trim();
 if(!t){n.textContent="Please write what you would like to change.";return}
 if(t===chgLast){n.textContent="This message was already sent. Change the text to send a new one.";return}
 var d=CD;chgSending=true;btn.disabled=true;n.textContent="Sending...";chgCount++;
 var msg=["CHANGE REQUESTED (not accepted yet)","Reference: "+(d.ref||"-"),"Message no.: "+chgCount,"From: "+(CS.signame||d.client||"client"),"","Message:",t].join("\n");
 send("Change requested #"+chgCount+" - "+(d.client||"client")+" - "+(d.ref||"no ref"),msg,CS.signame||d.client||"Client","").then(function(){chgSending=false;chgLast=t;n.textContent="";$("#chgForm").hidden=true;$("#chgDone").hidden=false;$("#chgSent").textContent=t;if(PVW){var bb=$("#chgDone b");if(bb)bb.textContent="Preview only: nothing was actually sent."}},function(e){chgSending=false;chgCount--;btn.disabled=false;n.textContent=friendlyErr(e)})}
function accKey(d){var x=JSON.stringify(d),h=5381;for(var i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))|0;return "dp_acc_"+(h>>>0).toString(36)}
function getAccepted(d){try{var r=localStorage.getItem(accKey(d));return r?JSON.parse(r):null}catch(e){return null}}
function setAccepted(d,o){try{localStorage.setItem(accKey(d),JSON.stringify(o))}catch(e){}}
function showAccepted(d,o){$("#confArea").hidden=true;$("#refNo2").textContent=d.ref||"";$("#thT").textContent="Already confirmed";$("#thP").textContent="This was confirmed by "+(o.n||"you")+" on "+(o.date||"an earlier date")+". Your designer has it, so nothing more is needed. If you need a change, please write to them directly.";var c=$("#copyBtn2");if(c)c.hidden=true;$("#pv").hidden=true;$("#thanks").classList.add("on")}
function genLink(){var d=SD,miss=[];["scope","deliv","fee"].forEach(function(k){if(!String(d[k]).trim())miss.push(k)});if(!cleanRows(d).length)miss.push("deliverables");
 var box=$("#linkbox"),out=$("#linkout"),info=$("#linkinfo");box.hidden=false;
 if(miss.length){out.value="";info.textContent="Fill these first: "+miss.join(", ")+".";return}
 var base=linkBase(),url=base+"#c="+encodeSetup(d);out.value=url;
 info.textContent="Link length: "+url.length+" characters."+(url.length>6000?" This is long. Shorten the scope or terms text, because some apps cut very long links.":"")+(CFG.proto?" In this preview the link will not open on its own. Use Preview as client.":"")+" Save a copy of this proposal for your records."}
function onClickOther(t){var a=t.dataset.act;
 if(MODE==="setup"){
  if(a==="dradd"){SD.rows.push(["","","",""]);saveSetup();$("#drows").innerHTML=setupHtml.call(null).match(/<div id="drows">([\s\S]*?)<\/div><button type="button" class="chip soft" data-act="dradd">/)[1]}
  else if(a==="drdel"){SD.rows.splice(+t.dataset.i,1);if(!SD.rows.length)SD.rows=[["","","",""]];saveSetup();$("#app").innerHTML=setupHtml()}
  else if(a==="conftog"){SD.conf=!SD.conf;t.setAttribute("aria-checked",String(!!SD.conf));saveSetup()}
  else if(a==="genlink")genLink();
  else if(a==="prevclient"){PM=CFG.proto?"confirm":null;if(CFG.proto){mount()}else{var d=SD;location.hash="#p="+encodeSetup(d)}}
  else if(a==="exload"){SD=exSetup();saveSetup();$("#app").innerHTML=setupHtml()}
  else if(a==="resetsetup"){SD=emptySetup();saveSetup();$("#app").innerHTML=setupHtml()}
  else if(a==="copylink"){var o=$("#linkout");copyText(o.value,t,o)}}
 else if(MODE==="confirm"){
  if(a==="chip"&&t.dataset.q==="port"){CS.port=CS.port===t.dataset.v?"":t.dataset.v;$$('[data-grp="port"] .chip').forEach(function(c){var on=CS.port===c.dataset.v;c.setAttribute("aria-checked",String(on));c.tabIndex=on?0:-1});clearBad("port")}
  else if(a==="agree"){CS.agree=!CS.agree;t.setAttribute("aria-checked",String(!!CS.agree));clearBad("agree")}
  else if(a==="accept")acceptNow();
  else if(a==="chgopen"){var b=$("#chgbox");b.hidden=!b.hidden;if(!b.hidden)$("#f-chg").focus()}
  else if(a==="chgsend")sendChange();
  else if(a==="pvback"){location.hash="#setup"}
  else if(a==="chgmore"){$("#chgDone").hidden=true;$("#chgForm").hidden=false;$("#f-chg").value="";$("#chgSendBtn").disabled=false;$("#f-chg").focus()}}}
function copyText(txt,btn,inp){var ok=function(){var o=btn.textContent;btn.textContent="Copied";setTimeout(function(){btn.textContent=o},1600)};
 function fb(){if(inp){inp.focus();inp.select()}btn.textContent="Selected, press copy"}
 try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}}
function onInputOther(t){if(MODE==="setup"){if(t.dataset.sf){SD[t.dataset.sf]=t.value;saveSetup();if(t.dataset.sf==="cancel"){$("#app").innerHTML=setupHtml();var s=$("#s-cancel");if(s)s.focus()}}
  else if(t.dataset.dr!==undefined){SD.rows[+t.dataset.dr][+t.dataset.dc]=t.value;saveSetup()}}
 else if(MODE==="confirm"&&t.dataset.act==="cin"){if(t.dataset.q==="signame"){CS.signame=t.value;clearBad("signame")}}}

/* ================= GLOBAL EVENT ROUTING ================= */
document.addEventListener("click",function(ev){
 var j=ev.target.closest("[data-jump]");if(j){ev.preventDefault();focusQ(j.dataset.jump);return}
 var t=ev.target.closest("[data-act]");if(!t)return;
 if(t.dataset.act==="theme"){setTheme(t.dataset.t,true);return}
 if(MODE==="brief")onClickBrief(t,ev);else onClickOther(t)});
document.addEventListener("input",function(ev){var t=ev.target;if(!t||!t.dataset)return;
 if(MODE==="brief"){if(t.dataset.act)onInputBrief(t)}else onInputOther(t)});
document.addEventListener("change",function(ev){var t=ev.target;if(t&&t.tagName==="SELECT"&&MODE==="setup")onInputOther(t)});
window.addEventListener("scroll",setCur,{passive:true});window.addEventListener("resize",setCur);

/* ================= INIT ================= */
(function(){var t=null;try{t=localStorage.getItem("dp_theme")}catch(e){}if(!THEMES.some(function(x){return x[0]===t}))t="ember";setTheme(t,false)})();
if(CFG.proto){$("#protoBanner").hidden=false;$("#pvbar").hidden=false}
if(window.__DP_TEST__)window.__DP_TEST__({S:function(){return S},CFG:CFG,setCFG:function(o){for(var k in o)CFG[k]=o[k]}});
mount();
})();
</script>
